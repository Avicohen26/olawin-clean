<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Olawin" />
    <meta property="og:title" content="Olawin — Gagnez des voyages de luxe" />
    <meta property="og:description" content="Participez à nos compétitions et tentez de gagner des voyages d'exception. Tirages certifiés, paiement sécurisé." />

    <meta name="twitter:image" content="https://raw.githubusercontent.com/Avicohen26/olawin-clean/main/og-image.jpg" />

    <!-- Fiche d'identite pour les moteurs de recherche -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Organization","name":"Olawin","url":"https://www.olawin.org/","logo":"https://raw.githubusercontent.com/Avicohen26/olawin-clean/main/og-image.jpg","description":"Olawin organise des competitions pour tenter de gagner des voyages de luxe et des sejours d'exception. Tirages certifies, paiement securise."}
    </script>
    <!-- Admin lisible sur mobile : menu en barre horizontale, contenu pleine largeur -->
    <style>
      @media (max-width: 820px){
        #root > div{ grid-template-columns: 1fr !important; }
        #root > div > aside{ position: static !important; height: auto !important; min-width: 0 !important; border-right: none !important; border-bottom: 1px solid rgba(0,0,0,0.12) !important; }
        #root > div > main{ min-width: 0 !important; padding: 18px 14px !important; }
        #root > div > aside > nav{ display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; overflow-x: auto !important; gap: 6px !important; padding: 10px 12px !important; -webkit-overflow-scrolling: touch; }
        #root > div > aside > nav > button{ width: auto !important; flex: 0 0 auto !important; white-space: nowrap !important; margin-bottom: 0 !important; border-left: none !important; border: 1px solid rgba(0,0,0,0.12) !important; border-radius: 20px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
